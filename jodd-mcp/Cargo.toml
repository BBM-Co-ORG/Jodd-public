[package]
name = "jodd-mcp"
version = "0.1.0"
edition = "2021"

[dependencies]
jodd_lib = { path = "../src-tauri", package = "jodd" }
tokio = { version = "1", features = ["full"] }
dirs = "5"
anyhow = "1"
rmcp = { version = "2", features = ["server", "macros", "transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
# Pinned to the same version src-tauri uses (Cargo.toml:60-61) so the
# workspace resolves one copy of each — never add a second html tree stack.
html5ever = "0.39"
markup5ever_rcdom = "0.39"

[dev-dependencies]
tempfile = "3"
